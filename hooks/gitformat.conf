# git-format 내부 기본값 상수 파일(git config 포맷). 여러 훅 파일(commit-msg,
# pre-commit, post-commit, checks/cpp.py, checks/sql.py)이 이 파일을
# `git config --file`로 읽어 값을 가져온다 — 각 훅의 실행 로직(함수/제어흐름)은
# 이 파일과 무관하게 파일마다 독립적으로 유지된다(공유하는 건 값뿐).
#
# 이 파일은 git-format 자체의 "내부 기본값"이고, 컨슈머 저장소가 오버라이드하는
# `git config gitformat.taskPrefix`/`gitformat.branchExempt`/`gitformat.aiModel`
# (컨슈머 저장소의 로컬/전역 git config)과는 레이어가 다르다 — 오버라이드가 있으면
# 그 값이 우선하고, 없으면 여기 기본값을 쓴다.
[gitformat]
	markerFile = .gitformat-verified
	taskPrefixDefault = GF
	branchExempt = main
	branchExempt = master
	branchExempt = develop
	branchExempt = release/*
	aiToolClaudeCode = claude-code
	coAuthoredBy = Claude <noreply@anthropic.com>
	knownModel = claude-opus-5
	knownModel = claude-sonnet-5
	knownModel = claude-haiku-4-5-20251001
	knownModel = claude-opus-4-7
	knownModel = gpt-5
	knownModel = gpt-5-mini
	knownModel = gemini-2.5-pro
	knownModel = gemini-2.5-flash
	type = feat
	type = fix
	type = docs
	type = style
	type = refactor
	type = perf
	type = test
	type = build
	type = ci
	type = chore
	type = revert
	sqlDialectDefault = ansi
	subjectMaxLength = 50
	bodyLineMaxLength = 72
[gitformat "trailer"]
	verifyBypassed = Verify-Bypassed
	taskId = Task-Id
	aiTool = AI-Tool
	aiToolVersion = AI-Tool-Version
	coAuthoredBy = Co-Authored-By
	aiModel = AI-Model
	tokensUsed = Tokens-Used
	toolCalls = Tool-Calls
	hooksCommit = Hooks-Commit
	signedOffBy = Signed-off-by
	fixes = Fixes
	breakingChange = BREAKING CHANGE
# 언어 감지 마커. 키마다 해석 방식이 다르다(GF-118) — 값을 바꿀 때 주의할 것.
#
#   리터럴 경로: ts, python, java, cpp, cppMake, sql
#     os.path.isfile()에 그대로 넘어간다. 글롭 메타문자를 써도 확장되지 않고
#     그런 이름의 파일을 찾으므로 조용히 미매칭된다(예: java = pom*.xml은 영원히
#     안 맞는다). 여러 후보가 필요하면 python처럼 키를 여러 줄로 나열할 것.
#   글롭 패턴: javaGradle(glob.glob), sqlGlob(git ls-files 경로명세)
#     리터럴 파일명을 넣어도 동작한다 — 글롭 패턴은 리터럴의 상위 집합이다.
#
# 값은 단어 분리되지 않는다. 공백이 든 값은 한 경로로 취급되므로 sh 시절
# `ls ${VAR}`이 갖고 있던 예기치 않은 파일 매칭 위험은 없다(decision-16 전환으로
# 해소, tests/marker-semantics.bats가 고정).
[gitformat "marker"]
	ts = package.json
	python = pyproject.toml
	python = requirements.txt
	java = pom.xml
	javaGradle = build.gradle*
	cpp = CMakeLists.txt
	cppMake = Makefile
	sql = .sqlfluff
	sqlGlob = *.sql
[gitformat "cpp"]
	ext = *.c
	ext = *.cc
	ext = *.cpp
	ext = *.cxx
	ext = *.h
	ext = *.hpp
	ext = *.hh
