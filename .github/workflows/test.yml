name: test

# git-format 자체의 개발용 CI(GF-21, decision-8). 컨슈머에 배포하는 verify.yml과
# 달리 이건 이 저장소 자신의 훅 코드 품질만 검사한다 — bats-core는 dev 전용 도구라
# 컨슈머에게 강제되지 않는다.
on:
  pull_request:
  push:
    branches: [main]

# 체크아웃과 읽기 전용 정적분석/테스트만 하고 아무 것도 쓰지 않으므로
# (decision-8: 권한 최소화 점검, GF-28) contents:read만으로 충분하다.
permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 이 스텝은 정적 분석 그 이상이다 - `-s sh`는 install.sh가 POSIX sh 문법만
      # 쓰는지 강제하는 게이트다(decision-9: 두 셸 스타일 가이드의 표기 관례만
      # 참고하고 문법은 POSIX만 유지하기로 함). 이 스텝을 지우거나 `-s bash`로
      # 바꾸면 그 정책이 깨진다. hooks/는 checks/(GF-108), commit-msg(GF-109),
      # pre-commit(GF-110), post-commit(GF-111)이 모두 Python으로 포팅돼
      # (decision-16) 대상에서 빠졌고 아래 ruff 스텝이 대신 맡는다 - install.sh만
      # decision-9의 적용을 그대로 받는다.
      - name: ShellCheck (POSIX 준수 게이트, decision-9)
        run: shellcheck -s sh install.sh
      # 이 job은 checkout 외에 아무것도 설치하지 않는다(bats job과 별개다).
      - name: Install ruff
        run: pip install --quiet ruff
      # ruff에 디렉터리를 넘기면 확장자가 .py인 파일만 훑는다(실측 확인). git이
      # 이름을 고정하는 훅 3개(commit-msg/pre-commit/post-commit)는 확장자가 없어,
      # Python으로 포팅돼도 hooks/ 하나만 지정하면 조용히 검사에서 빠진다 - 검사가
      # 아무것도 안 하고 통과하는 GF-32와 같은 유형이다. 그래서 셔뱅으로 Python
      # 파일을 찾아 함께 넘긴다. 이러면 훅이 하나씩 Python이 돼도(GF-109~111) 이
      # 스텝을 고칠 필요가 없다 - 파일명을 나열하는 위 ShellCheck 스텝과 반대다.
      # 찾은 파일은 따옴표 없는 변수의 단어분리에 맡기지 않고 배열로 넘긴다 -
      # 단어분리 여부는 셸마다 다르고(zsh는 기본적으로 하지 않는다) 그런 형태는
      # 러너 셸이 바뀌는 순간 조용히 대상이 하나로 뭉개진다. 대상이 0개면 역시
      # 조용히 통과하지 않고 test -n에서 멈춘다.
      - name: Ruff (Python 린트)
        shell: bash
        run: |
          set -u
          mapfile -t EXTRA < <(grep -rlE '^#!/usr/bin/env python3' hooks/ || true)
          RAW="$(ruff check --show-files hooks/ "${EXTRA[@]}")"
          FILES="$(printf '%s\n' "$RAW" | sort -u)"
          test -n "$FILES"
          echo "ruff 검사 대상 $(echo "$FILES" | wc -l)개:"
          echo "$FILES"
          ruff check hooks/ "${EXTRA[@]}"

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats-core
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
      - name: Install 언어별 체크 실도구 (sqlfluff/ruff)
        # GF-22 실도구 재검증 테스트가 실제로 sqlfluff/ruff를 요구하는데 이 CI에
        # 설치가 빠져있어 "차단돼야 할" 테스트가 도구 부재로 조용히 통과해버렸다
        # (실제 PR에서 발견). clang-format/mvn은 ubuntu-latest 러너에 기본 포함.
        run: pip install --quiet sqlfluff ruff
      - name: Run bats tests
        run: bats tests/
