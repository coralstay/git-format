name: test

# git-format 자체의 개발용 CI(GF-21, decision-7). 컨슈머에 배포하는 verify.yml과
# 달리 이건 이 저장소 자신의 훅 코드 품질만 검사한다 — bats-core는 dev 전용 도구라
# 컨슈머에게 강제되지 않는다.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck (정적 분석, decision-8)
        run: shellcheck -s sh hooks/commit-msg hooks/pre-commit hooks/pre-push hooks/post-commit hooks/checks/*.sh install.sh

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats-core
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
      - name: Install 언어별 체크 실도구 (sqlfluff/ruff)
        # GF-22 실도구 재검증 테스트가 실제로 sqlfluff/ruff를 요구하는데 이 CI에
        # 설치가 빠져있어 "차단돼야 할" 테스트가 도구 부재로 조용히 통과해버렸다
        # (실제 PR에서 발견). clang-format/mvn은 ubuntu-latest 러너에 기본 포함.
        run: pip install --quiet sqlfluff ruff
      - name: Run bats tests
        run: bats tests/
