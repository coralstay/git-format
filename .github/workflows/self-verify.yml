name: self-verify

# git-format이 스스로도 verify.yml(재사용 워크플로)의 검증을 받도록 호출한다.
# workflow_call 워크플로는 그 자체로는 실행되지 않고 반드시 이렇게 호출하는
# caller가 있어야 하므로(GF-20), 이 저장소도 예외 없이 dogfooding한다.
on:
  pull_request:

# verify.yml을 호출만 하고 그 자신은 아무 것도 하지 않으므로
# (decision-8: 권한 최소화 점검, GF-28) contents:read만으로 충분하다.
permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
