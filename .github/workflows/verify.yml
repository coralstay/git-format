name: git-format verify (reusable)

# opt-in 서버사이드 백스톱(decision-3). 로컬 git hook은 --no-verify나 core.hooksPath
# 해제로 우회 가능하므로, PR에 대해 브랜치 보호 필수 status check로 이 워크플로를
# 걸어두면 push 단계 우회까지 실질적으로 막을 수 있다. 사용법은
# docs/examples/github-actions-caller.yml 참고.
on:
  workflow_call: {}

# 체크아웃(다른 저장소 포함)과 읽기 전용 lint/build/test만 하고 아무 것도 쓰지
# 않으므로(decision-8: 권한 최소화 점검, GF-28) contents:read만으로 충분하다.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: fetch-depth 안전성 확인 (GF-28/GF-64)
        # 이 워크플로의 "Conventional Commits 형식 검증" 스텝은 git rev-list로
        # PR의 BASE..HEAD 범위를 순회하는데, 이게 caller 워크플로가 fetch-depth를
        # 지정했는지와 무관하게 항상 정상 동작하는 이유는 바로 위 체크아웃
        # 스텝이 fetch-depth: 0으로 고정돼 있기 때문이다(GF-28에서 실제 PR
        # 실행 로그로 1회 확인). 이 스텝은 그 전제를 매 실행마다(=이 워크플로가
        # 돌 때마다) 반복해서 검증한다 - 나중에 위 체크아웃에서 실수로
        # fetch-depth: 0을 지우면 여기서 즉시 실패한다.
        run: |
          set -eu
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "::error::체크아웃이 얕은 클론입니다 - fetch-depth: 0 설정이 깨졌을 수 있습니다(GF-28/GF-64)" >&2
            exit 1
          fi
          echo "fetch-depth 안전성 확인: 얕은 클론 아님"

      - name: Checkout git-format hooks
        uses: actions/checkout@v4
        with:
          repository: amosQP/git-format
          path: .git-format

      - name: Conventional Commits 형식 검증 (PR 커밋 전체)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          for sha in $(git rev-list "${BASE_SHA}..${HEAD_SHA}"); do
            git log -1 --pretty=%B "$sha" > /tmp/msg.txt
            echo "checking $sha"
            sh .git-format/hooks/commit-msg /tmp/msg.txt commit
          done

      - name: PR 변경분을 스테이징 상태로 노출
        # cpp.sh/sql.sh는 `git diff --cached`(HEAD 대비 인덱스 변경분)만 본다. 이
        # 워크플로는 체크아웃만 하고 아무 것도 커밋/스테이징하지 않으므로 두 체크가
        # 항상 조용히 no-op이었다(GF-32). git add -A는 이미 커밋된 파일에는 아무
        # 효과가 없어 통하지 않는다(index가 HEAD와 이미 동일하므로 diff가 안 생김) —
        # 대신 HEAD만 base로 되돌리고(index/워킹트리는 그대로 둔다) `git diff --cached`가
        # PR 전체 변경분을 "Added"로 보이게 만든다.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git reset --soft "$BASE_SHA"

      - name: 언어별 lint/컴파일 체크 (pre-commit과 동일 로직)
        run: sh .git-format/hooks/pre-commit

      - name: 언어별 빌드/테스트 (pre-push와 동일 로직)
        run: sh .git-format/hooks/pre-push
